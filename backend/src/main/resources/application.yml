server:
  port: 8080

spring:
  application:
    name: quest-rush
  datasource:
    # 数据库账号密码建议走环境变量，不硬编码进 Git（文档 7.7）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quest_rush}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB        # Excel 导入限制单文件 5MB（文档 4.4）
      max-request-size: 10MB
  mail:
    # SMTP 配置位：生产环境填入真实邮箱服务（部署时必须走 465 SSL，文档 4.7/7.7）
    # 未配置 host 时 MailService 走 mock（日志输出验证码），不影响流程
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，生产请移除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 逻辑删除：除 user_answer_log 外所有表统一 deleted 字段（文档 3.0）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: satoken          # 前端请求头 / cookie 名
  timeout: 2592000             # 30 天
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

learn:
  upload-dir: ./uploads        # 头像上传目录（生产部署建议改为绝对路径并禁执行权限）

logging:
  level:
    com.learn: info
